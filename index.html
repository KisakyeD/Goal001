<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Football Predictions - Real Odds</title>
<style>
:root{--bg-dark:#07090e;--card-bg:#121722;--card-border:#1e2638;--accent-yellow:#f5c518;--accent-green:#00ff88;--accent-red:#ff3366;--text-main:#f8fafc;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background-color:var(--bg-dark);color:var(--text-main);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px 8px;background-image:radial-gradient(circle at top center,#131c31 0%,var(--bg-dark) 70%)}
.container{width:100%;max-width:950px}
header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;background:var(--card-bg);border:1px solid var(--card-border);padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.brand-title{font-size:1.1rem;color:#fff;display:flex;align-items:center;gap:10px;font-weight:700}
.badge-ai{background:linear-gradient(135deg,#00c853,var(--accent-green));font-size:.6rem;padding:4px 8px;border-radius:20px;text-transform:uppercase;font-weight:800;color:#000}
.hamburger-btn{background:#1a2234;border:1px solid var(--card-border);color:var(--text-main);font-size:1.2rem;padding:6px 12px;border-radius:8px;cursor:pointer}
.hamburger-btn:hover{background:var(--card-border);border-color:var(--accent-yellow);color:var(--accent-yellow)}
.menu-drawer{position:fixed;top:0;right:-320px;width:290px;height:100vh;background:#0d121c;border-left:1px solid var(--card-border);box-shadow:-10px 0 30px rgba(0,0,0,.8);z-index:1000;display:flex;flex-direction:column;padding:20px;overflow-y:auto;transition:right .35s cubic-bezier(.16,1,.3,1)}
.menu-drawer.open{right:0}
.drawer-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--card-border);margin-bottom:16px}
.drawer-title{font-size:1rem;font-weight:800;color:var(--accent-yellow)}
.close-btn{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;color:var(--text-main);font-weight:600;cursor:pointer;transition:all .2s ease;margin-bottom:10px;font-size:.85rem}
.menu-item:hover,.menu-item.active{background:rgba(245,197,24,.1);border-color:var(--accent-yellow);color:var(--accent-yellow)}
.menu-item .cnt{font-size:.7rem;opacity:.8;font-weight:600}
.overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:999;display:none}
.overlay.active{display:block}
.live-dot{display:inline-block;width:8px;height:8px;background-color:var(--accent-green);border-radius:50%;margin-right:8px;box-shadow:0 0 10px var(--accent-green)}
.mode-banner{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.2);color:var(--accent-green);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:.82rem;font-weight:600}
.predictions-table-wrapper{background:var(--card-bg);border:2px solid var(--accent-yellow);border-radius:12px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.6);margin-bottom:20px}
.predictions-table-header{background:linear-gradient(135deg,#e6b800,var(--accent-yellow));color:#07090e;text-align:center;padding:14px;font-size:1.15rem;font-weight:800}
.table-scroll-container{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.predictions-table{width:100%;min-width:600px;border-collapse:collapse;text-align:center;font-size:.85rem}
.predictions-table th{background-color:#161e30;color:var(--accent-yellow);padding:10px 6px;border:1px solid var(--card-border);font-weight:700;text-transform:uppercase;font-size:.7rem}
.predictions-table td{padding:10px 6px;border:1px solid var(--card-border);color:var(--text-main);vertical-align:middle}
.predictions-table tr:nth-child(even){background-color:rgba(255,255,255,.015)}
.td-date{color:var(--accent-yellow);font-weight:700;width:65px}
.td-league{color:var(--accent-green);font-weight:600;font-size:.75rem}
.td-game{font-weight:600;font-size:.8rem}
.td-prediction{color:var(--accent-yellow);font-weight:700}
.td-odds{font-weight:700}
.result-win{color:var(--accent-green);font-weight:800;font-size:1.1rem}
.result-loss{color:var(--accent-red);font-weight:800;font-size:1.1rem}
.result-pending{color:var(--text-muted);font-style:italic;font-size:.75rem}
.table-footer-note{padding:12px 16px;background:#0d121c;color:var(--text-muted);font-size:.75rem;text-align:center;border-top:1px solid var(--card-border)}
.loading-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:40px;text-align:center;color:var(--accent-yellow);font-weight:600}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.filter-btn{background:#1a2234;border:1px solid var(--card-border);color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.8rem}
.filter-btn.active{background:var(--accent-yellow);color:#000;border-color:var(--accent-yellow)}
</style>
</head>
