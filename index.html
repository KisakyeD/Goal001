<div style="max-width:420px; margin:auto; font-family:Arial; text-align:center; border:1px solid #eee; border-radius:15px; padding:20px;">
  <h2>🎵 Buy TikTok Coins - Automatic</h2>
  <p>Pay with Airtel Money • Auto-Confirmed</p>

  <label><b>Your TikTok Username</b></label><br>
  <input id="username" type="text" placeholder="@nakato_ug" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; margin:10px 0;">

  <label><b>Choose Pack</b></label><br>
  <select id="pack" style="width:100%; padding:12px; border-radius:10px; margin:10px 0;">
    <option value="100 Coins - 35000">100 Coins - 35,000 UGX</option>
    <option value="350 Coins - 120000">350 Coins - 120,000 UGX</option>
    <option value="1000 Coins - 330,000 UGX">1000 Coins - 330,000 UGX</option>
  </select>

  <div style="background:#FF0000; color:white; padding:15px; border-radius:10px;">
    <b>PAY TO AIRTEL MERCHANT CODE</b><br>
    <span style="font-size:28px; font-weight:bold;">YOUR_CODE</span><br>
    Name: Whealth Services<br>
    Dial: *185*9*YOUR_CODE*Amount#
  </div>

  <br>
  <label><b>Paste Airtel Transaction ID from SMS</b></label><br>
  <input id="txid" type="text" placeholder="e.g. AP123456" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; margin:10px 0;">

  <a href="#" onclick="sendOrder()" style="background:#25D366; color:white; padding:15px; display:block; border-radius:10px; text-decoration:none; font-weight:bold;">
    I HAVE PAID → SEND ORDER
  </a>
  <p style="font-size:12px; color:grey;">We check your payment in our Airtel Merchant account automatically. Delivery in 2 mins.</p>
</div>

<script>
function sendOrder(){
  var pack = document.getElementById('pack').value;
  var user = document.getElementById('username').value;
  var tx = document.getElementById('txid').value;
  if(!user || !tx){ alert('Enter username + Transaction ID'); return; }
  var msg = "NEW COIN ORDER - AIRTEL%0A%0APack: " + pack + "%0AUsername: " + user + "%0ATxID: " + tx;
  window.open("https://wa.me/256707282428?text=" + msg, "_blank");
}
</script>
