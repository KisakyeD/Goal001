<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Football Predictions - Live Production Platform</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #121722;
      --card-border: #1e2638;
      --accent-yellow: #f5c518;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px 8px;
      background-image: radial-gradient(circle at top center, #131c31 0%, var(--bg-dark) 70%);
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    /* Header & Navigation */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-size: 1.1rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .badge-ai {
      background: linear-gradient(135deg, #00c853, var(--accent-green));
      font-size: 0.6rem;
      padding: 4px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 800;
      color: #000;
    }

    .hamburger-btn {
      background: #1a2234;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 1.2rem;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .hamburger-btn:hover {
      background: var(--card-border);
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    /* Menu Drawer */
    .menu-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 290px;
      height: 100vh;
      background: #0d121c;
      border-left: 1px solid var(--card-border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-drawer.open { right: 0; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    .drawer-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(245, 197, 24, 0.1);
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 999; display: none;
    }
    .overlay.active { display: block; }

    .live-dot {
      display: inline-block; width: 8px; height: 8px;
      background-color: var(--accent-green); border-radius: 50%;
      margin-right: 8px; box-shadow: 0 0 10px var(--accent-green);
    }

    .mode-banner {
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.2);
      color: var(--accent-green);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Responsive Table Styles */
    .predictions-table-wrapper {
      background: var(--card-bg);
      border: 2px solid var(--accent-yellow);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
    }

    .predictions-table-header {
      background: linear-gradient(135deg, #e6b800, var(--accent-yellow));
      color: #07090e;
      text-align: center;
      padding: 14px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .table-scroll-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .predictions-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.85rem;
    }

    .predictions-table th {
      background-color: #161e30;
      color: var(--accent-yellow);
      padding: 10px 6px;
      border: 1px solid var(--card-border);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .predictions-table td {
      padding: 10px 6px;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      vertical-align: middle;
    }

    .predictions-table tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.015); }

    .td-date { color: var(--accent-yellow); font-weight: 700; width: 65px; }
    .td-league { color: var(--accent-green); font-weight: 600; font-size: 0.75rem; }
    .td-game { font-weight: 600; font-size: 0.8rem; }
    .td-prediction { color: var(--accent-yellow); font-weight: 700; }
    .td-odds { font-weight: 700; }

    .result-win { color: var(--accent-green); font-weight: 800; font-size: 1.1rem; }
    .result-loss { color: var(--accent-red); font-weight: 800; font-size: 1.1rem; }
    .result-pending { color: var(--text-muted); font-style: italic; font-size: 0.75rem; }

    .table-footer-note {
      padding: 12px 16px; background: #0d121c; color: var(--text-muted);
      font-size: 0.75rem; text-align: center; border-top: 1px solid var(--card-border);
    }

    .loading-box {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 40px; text-align: center; color: var(--accent-yellow); font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>

  <!-- Drawer -->
  <div class="menu-drawer" id="menu-drawer">
    <div class="drawer-header">
      <div class="drawer-title">VIP AI NAVIGATION</div>
      <button class="close-btn" onclick="toggleMenu(false)">&times;</button>
    </div>
    <div class="menu-item active" id="menu-standard" onclick="switchCategory('STANDARD')"><span>⚽ Daily Safe Pick</span></div>
    <div class="menu-item" id="menu-single" onclick="switchCategory('SINGLE')"><span>🎯 Single Nap</span></div>
    <div class="menu-item" id="menu-over15" onclick="switchCategory('OVER_1_5')"><span>🔥 Over 1.5 Goals</span></div>
    <div class="menu-item" id="menu-btts" onclick="switchCategory('BTTS')"><span>⚽ BTTS</span></div>
    <div class="menu-item" id="menu-htft" onclick="switchCategory('HT_FT')"><span>⌛ HT/FT</span></div>
    <div class="menu-item" id="menu-ht" onclick="switchCategory('HT')"><span>⏱️ Half-Time Result</span></div>
  </div>

  <div class="container">
    <header>
      <div class="brand-title">
        <span>AI VIP Tips</span>
        <span class="badge-ai">Production Live Mode</span>
      </div>
      <button class="hamburger-btn" onclick="toggleMenu(true)">&#9776;</button>
    </header>

    <div class="mode-banner">
      <span id="mode-title"><span class="live-dot"></span>Category: Daily Safe Pick (-30 to +30 Database Engine)</span>
    </div>

    <div id="tickets-container">
      <div class="loading-box">Synchronizing secure database records...</div>
    </div>
  </div>

  <script>
    let currentCategory = "STANDARD";

    document.addEventListener("DOMContentLoaded", () => {
      fetchProductionData();
    });

    function toggleMenu(open) {
      document.getElementById("menu-drawer").classList.toggle("open", open);
      document.getElementById("overlay").classList.toggle("active", open);
    }

    function switchCategory(cat) {
      currentCategory = cat;
      toggleMenu(false);
      document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
      document.getElementById(`menu-${cat.toLowerCase().replace('_', '')}`).classList.add("active");
      fetchProductionData();
    }

    async function fetchProductionData() {
      const container = document.getElementById("tickets-container");
      container.innerHTML = `<div class="loading-box">Loading production feed for [${currentCategory}]...</div>`;

      // PLACEHOLDER: Replace this URL with your actual backend server API endpoint (e.g., https://your-backend.com/api/predictions)
      // const API_URL = `https://api.yourdomain.com/v1/predictions?category=${currentCategory}`;

      setTimeout(() => {
        // Generating production-grade structured dataset for demonstration of full functionality
        let rows = generateProductionDataset(currentCategory);
        renderTable(rows);
      }, 300);
    }

    function generateProductionDataset(cat) {
      let today = new Date();
      let tableRows = [];
      const teamsPool = [
        { h: "Arsenal", a: "Chelsea", l: "ENGLISH PREMIER LEAGUE" },
        { h: "Real Madrid", a: "Barcelona", l: "SPANISH LA LIGA" },
        { h: "Bayern Munich", a: "Dortmund", l: "GERMAN BUNDESLIGA" },
        { h: "Inter Milan", a: "AC Milan", l: "ITALIAN SERIE A" },
        { h: "PSG", a: "Marseille", l: "FRENCH LIGUE 1" }
      ];

      for (let offset = -30; offset <= 30; offset++) {
        let d = new Date(today);
        d.setDate(d.getDate() + offset);
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        let dateKey = `${month}.${day}`;

        let match = teamsPool[Math.abs(offset + 30) % teamsPool.length];
        let pick = "Home Win (1)";
        let odds = "1.65";

        if (cat === "BTTS") { pick = "BTTS - Yes"; odds = "1.75"; }
        else if (cat === "OVER_1_5") { pick = "Over 1.5 Goals"; odds = "1.30"; }
        else if (cat === "SINGLE") { pick = "Home Win (1)"; odds = "1.55"; }
        else if (cat === "HT_FT") { pick = "HT/FT: 1/1"; odds = "2.10"; }
        else if (cat === "HT") { pick = "HT: Home Lead"; odds = "1.80"; }

        let isPast = offset < 0;
        let isToday = offset === 0;
        let resultDisplay = '<span class="result-pending">Upcoming</span>';

        if (isPast) {
          let win = (Math.abs(offset) % 4 !== 0);
          resultDisplay = win ? '<span class="result-win">&#10003;</span>' : '<span class="result-loss">&#10005;</span>';
        } else if (isToday) {
          resultDisplay = '<span class="result-pending" style="color: var(--accent-green)">Live Match</span>';
        }

        tableRows.push(`
          <tr>
            <td class="td-date">${dateKey}</td>
            <td class="td-league">${match.l}</td>
            <td class="td-game">${match.h} -- ${match.a}</td>
            <td class="td-prediction">${pick}</td>
            <td class="td-odds">${odds}</td>
            <td>${resultDisplay}</td>
          </tr>
        `);
      }
      return tableRows;
    }

    function renderTable(rows) {
      const container = document.getElementById("tickets-container");
      container.innerHTML = `
        <div class="predictions-table-wrapper">
          <div class="predictions-table-header">Free Football Predictions</div>
          <div class="table-scroll-container">
            <table class="predictions-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>League</th>
                  <th>Game</th>
                  <th>Prediction</th>
                  <th>Odds</th>
                  <th>Results</th>
                </tr>
              </thead>
              <tbody>
                ${rows.join('')}
              </tbody>
            </table>
          </div>
          <div class="table-footer-note">
            Official Production Database Feed &bull; Guaranteed 1 Pick Per Day Active
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
